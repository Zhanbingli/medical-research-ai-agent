services:
  med-paper:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment to persist caches locally
    # volumes:
    #   - ./cache:/app/cache
    #   - ./data:/app/data
